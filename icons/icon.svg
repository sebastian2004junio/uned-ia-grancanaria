<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003a2b"/>
      <stop offset="45%" stop-color="#00533e"/>
      <stop offset="100%" stop-color="#0a8f6a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Neural Network & AI Graph connections -->
  <g stroke="rgba(124, 245, 200, 0.45)" stroke-width="3">
    <line x1="160" y1="180" x2="256" y2="140"/>
    <line x1="352" y1="180" x2="256" y2="140"/>
    <line x1="160" y1="180" x2="210" y2="270"/>
    <line x1="352" y1="180" x2="302" y2="270"/>
    <line x1="210" y1="270" x2="302" y2="270"/>
    <line x1="210" y1="270" x2="256" y2="350"/>
    <line x1="302" y1="270" x2="256" y2="350"/>
    <line x1="256" y1="140" x2="256" y2="230"/>
  </g>

  <!-- Central Brain / Circuit Core -->
  <circle cx="256" cy="140" r="16" fill="#7cf5c8" filter="url(#glow)"/>
  <circle cx="160" cy="180" r="14" fill="#3fcf9e"/>
  <circle cx="352" cy="180" r="14" fill="#3fcf9e"/>
  <circle cx="210" cy="270" r="15" fill="#7aa5ff"/>
  <circle cx="302" cy="270" r="15" fill="#7aa5ff"/>
  <circle cx="256" cy="350" r="18" fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- UNED text badge -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">UNED · IA</text>
  <!-- Gran Canaria badge -->
  <rect x="156" y="440" width="200" height="26" rx="13" fill="rgba(255,255,255,0.15)"/>
  <text x="256" y="458" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#7cf5c8" text-anchor="middle" letter-spacing="1.5">GRAN CANARIA</text>
</svg>
