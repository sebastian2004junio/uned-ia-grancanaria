<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="40%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Subtle circles -->
  <circle cx="256" cy="230" r="170" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="256" cy="230" r="120" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Open Book Symbol (Studyflow) -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M120 330 C120 230 180 230 256 250 C332 230 392 230 392 330"/>
    <path d="M120 180 C120 130 180 130 256 150 C332 130 392 130 392 180 L392 330 C332 310 332 310 256 330 C180 310 180 310 120 330 Z"/>
    <line x1="256" y1="150" x2="256" y2="330"/>
  </g>

  <!-- Sparkle Star on top -->
  <polygon points="256,70 266,95 295,100 272,118 280,146 256,130 232,146 240,118 217,100 246,95" fill="#fde047" filter="url(#glow)"/>

  <!-- Studyflow brand text -->
  <text x="256" y="420" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">STUDYFLOW</text>
  <rect x="136" y="442" width="240" height="28" rx="14" fill="rgba(255,255,255,0.18)"/>
  <text x="256" y="461" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle" letter-spacing="2">UNED · GRAN CANARIA</text>
</svg>
